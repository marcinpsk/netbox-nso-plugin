{# Lazy fragment: Interfaces drift/pending view — per-attribute, paginated + filterable, read-only. #}
<div class="nso-if-pager"
     data-url="{% url 'plugins:netbox_nso_plugin:device_nso_category' pk=object.pk key='interfaces' %}"
     data-q="{{ q }}" data-state="{{ state }}">
  <div class="mb-2">
    <input type="search" class="form-control form-control-sm nso-if-filter"
           placeholder="Filter by interface name…" value="{{ q }}" autocomplete="off"
           style="max-width: 280px;">
  </div>

  {% include "netbox_nso_plugin/categories/_interfaces_rows.html" %}

  <script>
  (function () {
    "use strict";
    var pager = document.querySelector('.nso-if-pager');
    if (!pager) return;
    var url = pager.dataset.url;
    var filter = pager.querySelector('.nso-if-filter');
    var results = pager.querySelector('.nso-if-results');
    var debounce = null;

    function load(q, state, page) {
      pager.dataset.q = q; pager.dataset.state = state;
      results.innerHTML = '<div class="text-muted small py-2"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Loading…</div>';
      fetch(url + '?q=' + encodeURIComponent(q) + '&state=' + encodeURIComponent(state) + '&page=' + page,
            { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (html) {
          var tmp = document.createElement('div'); tmp.innerHTML = html;
          var fresh = tmp.querySelector('.nso-if-results');
          if (fresh) { results.replaceWith(fresh); results = fresh; }
        })
        .catch(function (e) { results.innerHTML = '<div class="text-danger small">Failed to load: ' + e.message + '</div>'; });
    }

    if (filter) {
      filter.addEventListener('input', function () {
        clearTimeout(debounce);
        debounce = setTimeout(function () { load(filter.value.trim(), pager.dataset.state || 'all', 1); }, 350);
      });
    }
    // Delegated so it survives results being swapped out.
    pager.addEventListener('click', function (e) {
      var chip = e.target.closest('.nso-if-state');
      if (chip) { e.preventDefault(); load(pager.dataset.q || '', chip.dataset.state, 1); return; }
      var pg = e.target.closest('.nso-if-page');
      if (pg) { e.preventDefault(); load(pager.dataset.q || '', pager.dataset.state || 'all', pg.dataset.page); }
    });
  })();
  </script>
</div>
