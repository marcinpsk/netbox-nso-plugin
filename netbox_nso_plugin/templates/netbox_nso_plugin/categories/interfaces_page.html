{# Lazy fragment: Interfaces — paginated + name-filterable, read-only from persisted state. #}
<div class="nso-if-pager"
     data-url="{% url 'plugins:netbox_nso_plugin:device_nso_category' pk=object.pk key='interfaces' %}"
     data-q="{{ q }}">
  <div class="d-flex justify-content-between align-items-center mb-2 gap-2 flex-wrap">
    <input type="search" class="form-control form-control-sm nso-if-filter"
           placeholder="Filter interfaces by name…" value="{{ q }}" autocomplete="off"
           style="max-width: 280px;">
    {% if accept_all %}
      <form method="post" action="{% url 'plugins:netbox_nso_plugin:device_bulk_accept' object.pk %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-warning">
          <span class="mdi mdi-check-all"></span> Accept All Interfaces
        </button>
      </form>
    {% endif %}
  </div>

  {% include "netbox_nso_plugin/categories/_interfaces_rows.html" %}

  <script>
  (function () {
    "use strict";
    var pager = document.querySelector('.nso-if-pager');
    if (!pager) return;
    var url = pager.dataset.url;
    var filter = pager.querySelector('.nso-if-filter');
    var results = pager.querySelector('.nso-if-results');
    var debounce = null;

    function wirePages() {
      results.querySelectorAll('.nso-if-page').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          load(pager.dataset.q || '', a.dataset.page);
        });
      });
    }

    function load(q, page) {
      pager.dataset.q = q;
      results.innerHTML = '<div class="text-muted small py-2"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Loading…</div>';
      fetch(url + '?q=' + encodeURIComponent(q) + '&page=' + page, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (html) {
          var tmp = document.createElement('div'); tmp.innerHTML = html;
          var fresh = tmp.querySelector('.nso-if-results');
          if (fresh) { results.replaceWith(fresh); results = fresh; wirePages(); }
        })
        .catch(function (e) { results.innerHTML = '<div class="text-danger small">Failed to load: ' + e.message + '</div>'; });
    }

    if (filter) {
      filter.addEventListener('input', function () {
        clearTimeout(debounce);
        debounce = setTimeout(function () { load(filter.value.trim(), 1); }, 350);
      });
    }
    wirePages();
  })();
  </script>
</div>
