{% extends 'generic/object_edit.html' %}

{% block javascript %}
{{ block.super }}
<script>
(function () {
  "use strict";

  var instanceSelect = document.getElementById('id_nso_instance');
  var nameInput = document.getElementById('id_nso_device_name');
  if (!instanceSelect || !nameInput) return;

  // Embed the current NetBox device ID so we can exclude self-claims from warnings.
  // In edit mode this is the device already linked; in add mode it may be null.
  var currentNetboxDeviceId = {% if object and object.device %}{{ object.device.pk }}{% else %}null{% endif %};

  var datalist = document.createElement('datalist');
  datalist.id = 'nso-device-list';
  nameInput.setAttribute('list', 'nso-device-list');
  document.body.appendChild(datalist);

  // Inject a warning element directly below the name input.
  var warningEl = document.createElement('div');
  warningEl.id = 'nso-device-claimed-warning';
  warningEl.className = 'text-warning mt-1 small';
  warningEl.hidden = true;
  nameInput.parentNode.insertBefore(warningEl, nameInput.nextSibling);

  // Cached enriched device list — populated on instance change.
  var cachedDevices = [];

  function populateDatalist(devices) {
    cachedDevices = devices || [];
    datalist.innerHTML = '';
    cachedDevices.forEach(function (device) {
      var opt = document.createElement('option');
      opt.value = device.name;
      // Build a disambiguation label: "name — address (platform)"
      var parts = [];
      if (device.address) parts.push(device.address);
      if (device.platform) parts.push('(' + device.platform + ')');
      if (parts.length > 0) {
        opt.label = device.name + ' \u2014 ' + parts.join(' ');
      }
      datalist.appendChild(opt);
    });
  }

  function checkAlreadyClaimed(typedName) {
    var match = cachedDevices.find(function (d) { return d.name === typedName; });
    if (match && match.onboarded &&
        match.onboarded_netbox_device_id !== null &&
        match.onboarded_netbox_device_id !== currentNetboxDeviceId) {
      warningEl.textContent = '\u26a0 Already mapped to NetBox device #' +
                              match.onboarded_netbox_device_id;
      warningEl.hidden = false;
    } else {
      warningEl.hidden = true;
    }
  }

  function loadDeviceNames(pk) {
    if (!pk) { populateDatalist([]); warningEl.hidden = true; return; }
    fetch('/plugins/nso/ajax/nso-device-names/' + pk + '/')
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (data) {
        populateDatalist(data.devices || []);
        // Re-check warning in case input already has a value (edit mode)
        if (nameInput.value) checkAlreadyClaimed(nameInput.value);
      })
      .catch(function (err) {
        console.warn('NSO device names fetch failed:', err);
      });
  }

  nameInput.addEventListener('input', function () {
    checkAlreadyClaimed(nameInput.value);
  });

  instanceSelect.addEventListener('change', function () {
    loadDeviceNames(instanceSelect.value);
  });

  if (instanceSelect.value) {
    loadDeviceNames(instanceSelect.value);
  }
})();
</script>
{% endblock javascript %}
