[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-nso-plugin"
version = "1.0.0"
description = "NetBox plugin integrating NetBox with Cisco NSO via the nso-adapter REST API"
readme = "README.md"
requires-python = ">=3.12.0"
license = "Apache-2.0"
authors = [
    {name = "Marcin Zieba"},
]
keywords = [
    "netbox",
    "plugin",
    "nso",
    "cisco",
    "automation",
    "networking",
]
dependencies = [
    "requests>=2.34.2",
    "sqlparse>=0.5.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Environment :: Plugins",
    "Topic :: System :: Networking",
]

[project.urls]
Repository = "https://github.com/marcinpsk/netbox-nso-plugin"
Issues = "https://github.com/marcinpsk/netbox-nso-plugin/issues"

[tool.setuptools.packages.find]
include = ["netbox_nso_plugin*"]

[tool.setuptools.package-data]
netbox_nso_plugin = ["templates/**/*", "static/**/*"]

[tool.semantic_release]
allow_zero_version = true
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["netbox_nso_plugin/__init__.py:__version__"]
# The PSR action container has no uv, so bootstrap it before locking. Scoped to THIS
# package on purpose: a bare `uv lock` re-resolves the whole graph, which would fold
# unrelated dependency upgrades into a release commit nobody reviewed.
build_command = """
set -e
command -v uv >/dev/null || python -m pip install 'uv == 0.12.4'
uv lock --upgrade-package netbox-nso-plugin
"""
# PSR adds these to the release commit, so the tag ships a lock matching its version.
assets = ["uv.lock"]
# PSR strips the build env to an allowlist; forward only vars that are safe when
# empty (PSR passes unset entries as "", which uv rejects for boolish UV_* vars).
build_command_env = ["http_proxy", "https_proxy", "no_proxy"]

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "revert"]
parse_squash_commits = false

[dependency-groups]
dev = [
    "build",
    "reuse",
    "ruff==0.15.4",
    "pre-commit",
    "pytest",
    "pytest-django",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "django>=6.1,<7.0",
    "requests-mock",
    "zizmor==1.29.0",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["/opt/netbox/netbox", "netbox_stubs"]
DJANGO_SETTINGS_MODULE = "netbox.settings"
# Coverage has ONE source of truth: the [tool.coverage.*] tables below. Every entry
# point is pytest with pytest-cov, and `--cov` honors [tool.coverage.report]
# fail_under: CI's hermetic lane, the devcontainer's netbox-test-coverage, and a raw
# `pytest` all report the same number. (pythonpath is devcontainer-only; CI replaces
# it with `-o pythonpath=../netbox/netbox`.)
addopts = "-n auto --cov=netbox_nso_plugin --cov-report=term-missing --reuse-db"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "D", "C901", "I", "RET", "UP"]
ignore = [
    "E501",
    "F403",
    "F405",
    # Docstring PRESENCE is not required — we enforce one FORMAT convention, not coverage.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    # One convention: summary on the first line (D212), no blank line before a class
    # docstring (D211) — i.e. disable the conflicting D213/D203.
    "D203",
    "D213",
    "UP042",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/migrations/*.py" = ["D"]
"*/tests/*.py" = ["D"]
".devcontainer/**" = ["D"]

[tool.coverage.run]
source = ["netbox_nso_plugin"]
# Only the two universally-safe exclusions. Per
# ../nso-adapter/docs/testing-strategy.md §5.1, file-level omits for "purely
# declarative" or "needs integration tests" modules are not allowed — they
# absorb future branching logic silently. Use # pragma: no cover at the line
# level if a specific branch is genuinely unreachable.
omit = [
    "*/migrations/*",
    "*/tests/*",
]
branch = true

[tool.coverage.report]
# Target: 90% (aspirational). Temporarily lowered to 83 to unblock the stable-base
# merge: the CI test-netbox job only began running to completion once the NetBox
# version + netbox_routing install were fixed, which surfaced genuine coverage debt
# (reconcile.py, api/views.py, redistribution_reconciler.py, views.py, signals.py).
# Actual is 84%; raise back toward 90 as those modules gain tests.
fail_under = 83
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
