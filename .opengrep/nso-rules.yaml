rules:
  - id: nso-push-inside-suppression
    languages: [python]
    severity: ERROR
    message: Schedule the intent push after the suppression context exits.
    patterns:
      - pattern-inside: |
          with suppress_intent_push():
              ...
      - pattern: _schedule_intent_push(...)
  - id: nso-tautological-assertion
    languages: [python]
    severity: ERROR
    message: Compare the observed value with an independent expected value.
    patterns:
      - pattern-either:
          - pattern: $SELF.assertEqual($VALUE, $VALUE, ...)
          - pattern: assert $VALUE == $VALUE
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*$'
  - id: nso-global-monotonic-patch
    languages: [python]
    severity: ERROR
    message: Patch a module-local clock wrapper. Patching time.monotonic changes the shared module.
    patterns:
      - pattern: unittest.mock.patch($TARGET, ...)
      - metavariable-regex:
          metavariable: $TARGET
          regex: '[\x22\x27](?:[a-zA-Z_][a-zA-Z0-9_]*\.)*time\.monotonic[\x22\x27]'
  - id: nso-swallowed-barrier-failure
    languages: [python]
    severity: ERROR
    message: Fail the test when a synchronization barrier breaks.
    pattern-either:
      - pattern: |
          try:
              ...
          except threading.BrokenBarrierError:
              pass
      - pattern: |
          try:
              ...
          except threading.BrokenBarrierError:
              return
  - id: nso-vlan-group-mutable-lookup
    languages: [python]
    severity: ERROR
    message: Look up VLANGroup by its unique slug. Put the mutable name in defaults.
    pattern: ipam.models.VLANGroup.objects.get_or_create(..., slug=$SLUG, name=$NAME, ...)
  - id: nso-write-set-cardinality-assertion
    languages: [python]
    severity: ERROR
    message: Use assertCountEqual so an exact write-set assertion preserves duplicate writes.
    pattern-either:
      - pattern: $SELF.assertEqual({$VALUE for $WRITE in $PLAN.write_set}, $EXPECTED, ...)
      - pattern: $SELF.assertEqual({$VALUE for $WRITE in $PLAN.write_set if $CONDITION}, $EXPECTED, ...)
      - pattern: $SELF.assertEqual($EXPECTED, {$VALUE for $WRITE in $PLAN.write_set}, ...)
      - pattern: $SELF.assertEqual($EXPECTED, {$VALUE for $WRITE in $PLAN.write_set if $CONDITION}, ...)
  - id: nso-signal-connect-without-dispatch-uid
    languages: [python]
    severity: ERROR
    message: Connect the signal with dispatch_uid; a re-imported module registers the receiver twice.
    patterns:
      - pattern-either:
          - pattern: pre_save.connect(...)
          - pattern: post_save.connect(...)
          - pattern: pre_delete.connect(...)
          - pattern: post_delete.connect(...)
          - pattern: m2m_changed.connect(...)
      - pattern-not: $SIGNAL.connect(..., dispatch_uid=$UID, ...)
    paths:
      exclude:
        # Tests connect a temporary receiver and disconnect it in teardown.
        - "**/tests/**"
