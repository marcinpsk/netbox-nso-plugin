rules:
  - id: nso-push-inside-suppression
    languages: [python]
    severity: ERROR
    message: Schedule the intent push after the suppression context exits.
    patterns:
      - pattern-either:
          - pattern-inside: |
              with suppress_intent_push():
                  ...
          - pattern-inside: |
              with $MODULE.suppress_intent_push():
                  ...
      - pattern-either:
          - pattern: _schedule_intent_push(...)
          - pattern: $SIGNALS._schedule_intent_push(...)
  - id: nso-tautological-assertion
    languages: [python]
    severity: ERROR
    message: Compare the observed value with an independent expected value.
    patterns:
      - pattern-either:
          - pattern: $SELF.assertEqual($VALUE, $VALUE, ...)
          - pattern: assert $VALUE == $VALUE
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*$'
  - id: nso-global-monotonic-patch
    languages: [python]
    severity: ERROR
    message: Patch a module-local clock wrapper. Patching time.monotonic changes the shared module.
    patterns:
      - pattern: unittest.mock.patch($TARGET, ...)
      - metavariable-regex:
          metavariable: $TARGET
          regex: '[\x22\x27](?:[a-zA-Z_][a-zA-Z0-9_]*\.)*time\.monotonic[\x22\x27]'
  - id: nso-swallowed-barrier-failure
    languages: [python]
    severity: ERROR
    message: Fail the test when a synchronization barrier breaks.
    pattern-either:
      - pattern: |
          try:
              ...
          except threading.BrokenBarrierError:
              pass
      - pattern: |
          try:
              ...
          except threading.BrokenBarrierError:
              return
  - id: nso-unbounded-thread-join
    languages: [python]
    severity: ERROR
    message: Use a bounded timeout for thread joins.
    patterns:
      - pattern-either:
          - pattern: $THREAD.join()
          - pattern: $THREAD.join(None)
          - pattern: $THREAD.join(timeout=None)
          - pattern: $THREAD.join(**$OPTIONS)
          - patterns:
              - pattern: $THREAD.join(**$OPTIONS, ...)
              - pattern-not: $THREAD.join(..., timeout=$TIMEOUT, ...)
          - pattern: $THREAD.join(timeout=None, **$OPTIONS)
          - pattern: $THREAD.join(None, **$OPTIONS)
          - pattern: $THREAD.join(None, ...)
          - pattern: $THREAD.join(..., timeout=None, ...)
          - patterns:
              - pattern: $THREAD.join(...)
              - pattern-not: $THREAD.join($ARG, ...)
              - pattern-not: $THREAD.join(..., timeout=$TIMEOUT, ...)
      - pattern-either:
          - pattern-inside: |
              import threading
              ...
          - pattern-inside: |
              import threading as $T
              ...
          - pattern-inside: |
              from threading import $X
              ...
          - pattern-inside: |
              from threading import $X as $Y
              ...
          - pattern-inside: |
              ...
              import threading
          - pattern-inside: |
              ...
              import threading as $T
          - pattern-inside: |
              ...
              from threading import $X
          - pattern-inside: |
              ...
              from threading import $X as $Y
    paths:
      include: ["netbox_nso_plugin/tests/**"]
  - id: nso-retired-push-builder
    languages: [python]
    severity: ERROR
    message: Name push builders only in the delivery registry.
    patterns:
      - pattern-either:
          - pattern: $F(...)
          - pattern: $M.$F(...)
          - pattern: '$F: $T'
          - patterns:
              - pattern: $F
              - pattern-not-inside: $F(...)
              - pattern-not-inside: $M.$F
              - pattern-not-inside: from $M import $F
              - pattern-not-inside: from $M import $F as $A
              - pattern-not-inside: import $F
              - pattern-not-inside: import $F as $A
              - pattern-not-inside: import $M.$F
          - patterns:
              - pattern: $M.$F
              - pattern-not-inside: $M.$F(...)
              - pattern-not-inside: import $M.$F
          - pattern: from $M import $F
          - pattern: from $M import $F as $A
          - pattern: import $M.$F
          - pattern: import $F
          - pattern: import $F as $A
      - metavariable-regex:
          metavariable: $F
          regex: '^_push_[a-z0-9_]+_intent_for_device$'
    paths:
      include: ["netbox_nso_plugin/**/*.py"]
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
        - "**/delivery.py"
  - id: nso-retired-coalescer-state
    languages: [python]
    severity: ERROR
    message: Keep intent state in the durable outbox.
    patterns:
      - pattern-either:
          - pattern: $F(...)
          - pattern: $M.$F(...)
          - pattern: '$F: $T'
          - patterns:
              - pattern: $F
              - pattern-not-inside: $F(...)
              - pattern-not-inside: $M.$F
              - pattern-not-inside: from $M import $F
              - pattern-not-inside: from $M import $F as $A
              - pattern-not-inside: import $F
              - pattern-not-inside: import $F as $A
              - pattern-not-inside: import $M.$F
          - patterns:
              - pattern: $M.$F
              - pattern-not-inside: $M.$F(...)
              - pattern-not-inside: import $M.$F
          - pattern: from $M import $F
          - pattern: from $M import $F as $A
          - pattern: import $M.$F
          - pattern: import $F
          - pattern: import $F as $A
      - metavariable-regex:
          metavariable: $F
          regex: '^_(?:pending_pushes|last_pushed_hashes)$'
    paths:
      include: ["netbox_nso_plugin/**/*.py"]
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
  - id: nso-retired-renderer-writer-symbol
    languages: [python]
    severity: ERROR
    message: Do not restore retired renderer-writer symbols.
    patterns:
      - pattern-either:
          - pattern: $F(...)
          - pattern: $M.$F(...)
          - pattern: '$F: $T'
          - pattern: |
              def $F(...):
                  ...
          - patterns:
              - pattern: $F
              - pattern-not-inside: $F(...)
              - pattern-not-inside: $M.$F
              - pattern-not-inside: from $M import $F
              - pattern-not-inside: from $M import $F as $A
              - pattern-not-inside: import $F
              - pattern-not-inside: import $F as $A
              - pattern-not-inside: import $M.$F
          - patterns:
              - pattern: $M.$F
              - pattern-not-inside: $M.$F(...)
              - pattern-not-inside: import $M.$F
          - pattern: from $M import $F
          - pattern: from $M import $F as $A
          - pattern: import $M.$F
          - pattern: import $F
          - pattern: import $F as $A
      - metavariable-regex:
          metavariable: $F
          regex: '^_(?:IMPLICIT_PERMITS|authorize_dml|begin_delete_implicit|begin_implicit|begin_m2m_implicit|create_greenfield_subif_state|discard_rolled_back_implicit_permit|dml_guard|end_implicit|end_m2m_implicit|install_guard|on_routing_static_route_pre_save|parse_dml_target|remove_static_route_for_device|static_route_content|transition_static_route_content)$'
    paths:
      include: ["netbox_nso_plugin/**/*.py"]
      exclude:
        - "netbox_nso_plugin/tests/**"
        - "netbox_nso_plugin/migrations/**"
  - id: nso-retired-interface-config-literal
    languages: [python]
    severity: ERROR
    message: Read the interface receipt section from the delivery registry.
    pattern: '"interface_config"'
    paths:
      include: ["netbox_nso_plugin/**/*.py"]
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
        - "**/delivery.py"
  - id: nso-vlan-group-mutable-lookup
    languages: [python]
    severity: ERROR
    message: Look up VLANGroup by its unique slug. Put the mutable name in defaults.
    pattern: ipam.models.VLANGroup.objects.get_or_create(..., slug=$SLUG, name=$NAME, ...)
  - id: nso-write-set-cardinality-assertion
    languages: [python]
    severity: ERROR
    message: Use assertCountEqual so an exact write-set assertion preserves duplicate writes.
    pattern-either:
      - pattern: $SELF.assertEqual({$VALUE for $WRITE in $PLAN.write_set}, $EXPECTED, ...)
      - pattern: $SELF.assertEqual({$VALUE for $WRITE in $PLAN.write_set if $CONDITION}, $EXPECTED, ...)
      - pattern: $SELF.assertEqual($EXPECTED, {$VALUE for $WRITE in $PLAN.write_set}, ...)
      - pattern: $SELF.assertEqual($EXPECTED, {$VALUE for $WRITE in $PLAN.write_set if $CONDITION}, ...)
  - id: nso-implicit-text-encoding
    languages: [python]
    severity: ERROR
    message: Pass encoding="utf-8" so the text file decodes the same on every platform.
    patterns:
      - pattern-either:
          - pattern: $P.read_text(...)
          - pattern: $P.write_text(...)
          - pattern: $P.open(...)
          - pattern: open(...)
      - pattern-not: $P.read_text(..., encoding=$E, ...)
      - pattern-not: $P.write_text(..., encoding=$E, ...)
      - pattern-not: $P.open(..., encoding=$E, ...)
      - pattern-not: open(..., encoding=$E, ...)
      # A literal mode string that contains "b" opens the file in binary mode.
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: open($FILE, $MODE, ...)
                - pattern: open(..., mode=$MODE, ...)
                - pattern: $P.open($MODE, ...)
                - pattern: $P.open($FILE, $MODE, ...)
                - pattern: $P.open(..., mode=$MODE, ...)
            - metavariable-regex:
                metavariable: $MODE
                regex: '^[\x22\x27][^\x22\x27]*b'
  - id: nso-silent-duplicate-adapter-entry
    languages: [python]
    severity: ERROR
    message: Reject a repeated adapter entry instead of keeping the first value.
    patterns:
      - pattern: |
          if $KEY in $SEEN:
              continue
      - pattern-either:
          - pattern-inside: |
              for $ENTRY in $PAYLOAD.get("entries") or []:
                  ...
          - pattern-inside: |
              for $ENTRY in normalized:
                  ...
          - pattern-inside: |
              for $ENTRY in entries:
                  ...
  - id: nso-signal-connect-without-dispatch-uid
    languages: [python]
    severity: ERROR
    message: Connect the signal with dispatch_uid; a re-imported module registers the receiver twice.
    patterns:
      - pattern-either:
          - pattern: django.db.models.signals.pre_save.connect(...)
          - pattern: django.db.models.signals.post_save.connect(...)
          - pattern: django.db.models.signals.pre_delete.connect(...)
          - pattern: django.db.models.signals.post_delete.connect(...)
          - pattern: django.db.models.signals.m2m_changed.connect(...)
      - pattern-not: $SIGNAL.connect(..., dispatch_uid=$UID, ...)
    paths:
      exclude:
        # Tests connect a temporary receiver and disconnect it in teardown.
        - "**/tests/**"
  - id: nso-renderer-writer-single-resolver
    languages: [python]
    severity: ERROR
    message: RendererWriter must declare exactly one direct _resolve_reference method.
    # Split declarations so the rule-root check does not treat them as calls.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  class $CLASS(...):
                      ...
              - metavariable-regex:
                  metavariable: $CLASS
                  regex: '^RendererWriter$'
              - pattern-not: |
                  class $CLASS(...):
                      ...
                      def _resolve_reference\
                      (...):
                          ...
          - patterns:
              - pattern: |
                  class $CLASS(...):
                      ...
                      def _resolve_reference\
                      (...):
                          ...
                      ...
                      def _resolve_reference\
                      (...):
                          ...
              - metavariable-regex:
                  metavariable: $CLASS
                  regex: '^RendererWriter$'
      # Match only an unindented class header at module scope.
      - pattern-regex: '(?m)^class[ \t]+RendererWriter(?:[ \t]*\[|[ \t]*\(|[ \t]*:)'
    paths:
      include: ["netbox_nso_plugin/renderer_writer.py"]
  - id: nso-resume-failure-guidance
    languages: [python]
    severity: ERROR
    message: >-
      Call resume() as the only statement of a try. Its BaseException handler must report the
      quiesced state and the nso_intent_deployment_gate --abort recovery inside
      contextlib.suppress(Exception), then re-raise.
    patterns:
      - pattern-either:
          - pattern: netbox_nso_plugin.deployment.resume(...)
          - patterns:
              - pattern-inside: |
                  import netbox_nso_plugin as $PACKAGE
                  ...
              - pattern: $PACKAGE.deployment.resume(...)
          - patterns:
              - pattern-inside: |
                  import netbox_nso_plugin.deployment as $DEPLOYMENT
                  ...
              - pattern: $DEPLOYMENT.resume(...)
          - patterns:
              - pattern-inside: |
                  from netbox_nso_plugin import deployment
                  ...
              - pattern: deployment.resume(...)
          # A relative import resolves to the package at every dot level, so spell each level out.
          - patterns:
              - pattern-inside: |
                  from . import deployment
                  ...
              - pattern: deployment.resume(...)
          - patterns:
              - pattern-inside: |
                  from .. import deployment
                  ...
              - pattern: deployment.resume(...)
          - patterns:
              - pattern-inside: |
                  from ... import deployment
                  ...
              - pattern: deployment.resume(...)
          - patterns:
              - pattern-inside: |
                  from . import deployment as $DEPLOYMENT
                  ...
              - pattern: $DEPLOYMENT.resume(...)
          - patterns:
              - pattern-inside: |
                  from .. import deployment as $DEPLOYMENT
                  ...
              - pattern: $DEPLOYMENT.resume(...)
          - patterns:
              - pattern-inside: |
                  from ... import deployment as $DEPLOYMENT
                  ...
              - pattern: $DEPLOYMENT.resume(...)
          - patterns:
              - pattern-inside: |
                  from netbox_nso_plugin.deployment import resume
                  ...
              - pattern: resume(...)
          - patterns:
              - pattern-inside: |
                  from netbox_nso_plugin.deployment import resume as $RESUME
                  ...
              - pattern: $RESUME(...)
          - patterns:
              - pattern-inside: |
                  from .deployment import resume
                  ...
              - pattern: resume(...)
          - patterns:
              - pattern-inside: |
                  from ..deployment import resume
                  ...
              - pattern: resume(...)
          - patterns:
              - pattern-inside: |
                  from ...deployment import resume
                  ...
              - pattern: resume(...)
          - patterns:
              - pattern-inside: |
                  from .deployment import resume as $RESUME
                  ...
              - pattern: $RESUME(...)
          - patterns:
              - pattern-inside: |
                  from ..deployment import resume as $RESUME
                  ...
              - pattern: $RESUME(...)
          - patterns:
              - pattern-inside: |
                  from ...deployment import resume as $RESUME
                  ...
              - pattern: $RESUME(...)
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    try:
                        $CALL(...)
                    except BaseException:
                        with contextlib.suppress(Exception):
                            self.stderr.write($MESSAGE, ...)
                        raise
                - pattern: |
                    try:
                        $CALL(...)
                    except BaseException as $EXC:
                        with contextlib.suppress(Exception):
                            self.stderr.write($MESSAGE, ...)
                        raise
                # A finally clause does not change the handler contract.
                - pattern: |
                    try:
                        $CALL(...)
                    except BaseException:
                        with contextlib.suppress(Exception):
                            self.stderr.write($MESSAGE, ...)
                        raise
                    finally:
                        ...
                - pattern: |
                    try:
                        $CALL(...)
                    except BaseException as $EXC:
                        with contextlib.suppress(Exception):
                            self.stderr.write($MESSAGE, ...)
                        raise
                    finally:
                        ...
                - patterns:
                    - pattern-inside: |
                        from contextlib import suppress
                        ...
                    - pattern: |
                        try:
                            $CALL(...)
                        except BaseException:
                            with suppress(Exception):
                                self.stderr.write($MESSAGE, ...)
                            raise
                - patterns:
                    - pattern-inside: |
                        from contextlib import suppress
                        ...
                    - pattern: |
                        try:
                            $CALL(...)
                        except BaseException as $EXC:
                            with suppress(Exception):
                                self.stderr.write($MESSAGE, ...)
                            raise
                - patterns:
                    - pattern-inside: |
                        from contextlib import suppress
                        ...
                    - pattern: |
                        try:
                            $CALL(...)
                        except BaseException:
                            with suppress(Exception):
                                self.stderr.write($MESSAGE, ...)
                            raise
                        finally:
                            ...
                - patterns:
                    - pattern-inside: |
                        from contextlib import suppress
                        ...
                    - pattern: |
                        try:
                            $CALL(...)
                        except BaseException as $EXC:
                            with suppress(Exception):
                                self.stderr.write($MESSAGE, ...)
                            raise
                        finally:
                            ...
                - patterns:
                    - pattern-inside: |
                        import contextlib as $CONTEXTLIB
                        ...
                    - pattern: |
                        try:
                            $CALL(...)
                        except BaseException:
                            with $CONTEXTLIB.suppress(Exception):
                                self.stderr.write($MESSAGE, ...)
                            raise
                - patterns:
                    - pattern-inside: |
                        import contextlib as $CONTEXTLIB
                        ...
                    - pattern: |
                        try:
                            $CALL(...)
                        except BaseException as $EXC:
                            with $CONTEXTLIB.suppress(Exception):
                                self.stderr.write($MESSAGE, ...)
                            raise
                - patterns:
                    - pattern-inside: |
                        import contextlib as $CONTEXTLIB
                        ...
                    - pattern: |
                        try:
                            $CALL(...)
                        except BaseException:
                            with $CONTEXTLIB.suppress(Exception):
                                self.stderr.write($MESSAGE, ...)
                            raise
                        finally:
                            ...
                - patterns:
                    - pattern-inside: |
                        import contextlib as $CONTEXTLIB
                        ...
                    - pattern: |
                        try:
                            $CALL(...)
                        except BaseException as $EXC:
                            with $CONTEXTLIB.suppress(Exception):
                                self.stderr.write($MESSAGE, ...)
                            raise
                        finally:
                            ...
            # A second handler can swallow the resume failure before the BaseException handler runs.
            # One bound clause covers both binding orders; spell out the bound and finally combinations.
            - pattern-not: |
                try:
                    ...
                except $FIRST:
                    ...
                except $SECOND:
                    ...
            - pattern-not: |
                try:
                    ...
                except $FIRST:
                    ...
                except $SECOND:
                    ...
                finally:
                    ...
            - pattern-not: |
                try:
                    ...
                except $FIRST:
                    ...
                except $SECOND as $E2:
                    ...
            - pattern-not: |
                try:
                    ...
                except $FIRST:
                    ...
                except $SECOND as $E2:
                    ...
                finally:
                    ...
            - pattern-not: |
                try:
                    ...
                except $FIRST as $E1:
                    ...
                except $SECOND as $E2:
                    ...
            - pattern-not: |
                try:
                    ...
                except $FIRST as $E1:
                    ...
                except $SECOND as $E2:
                    ...
                finally:
                    ...
            - metavariable-regex:
                metavariable: $MESSAGE
                regex: '(?s).*may remain quiesced'
            - metavariable-regex:
                metavariable: $MESSAGE
                regex: '(?s).*nso_intent_deployment_gate --abort'
      # Abort is the requested operation, so its failure already names the failed operation.
      - pattern-not-inside:
          patterns:
            - pattern: |
                if $OPTIONS["abort"]:
                    ...
            - pattern-inside: |
                def $HANDLE(self, *args, **options):
                    ...
            - metavariable-regex:
                metavariable: $HANDLE
                regex: '^handle$'
    paths:
      include: ["netbox_nso_plugin/management/commands/**"]
