name: Test with supported NetBox and Python versions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
      - 'stack/1627-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-netbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - python-version: "3.12"
            netbox-version: "v4.6.1"
          - python-version: "3.13"
            netbox-version: "v4.6.7"

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: netbox-nso-plugin
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout NetBox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: netbox-community/netbox
          path: netbox
          ref: ${{ matrix.netbox-version }}
          persist-credentials: false

      # The joined pin boots the real adapter from this exact commit. It verifies
      # both O3c execution and the paginated generation-listing contract.
      - name: Checkout the pinned adapter for the joined pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: marcinpsk/nso-adapter
          ref: 4296309b020884e705b8c0cc9c09eac7d4512fe2
          path: .o3c-adapter
          persist-credentials: false

      - name: Install NetBox and plugin
        working-directory: netbox-nso-plugin
        run: |
          uv pip install --system -r ../netbox/requirements.txt
          uv pip install --system pytest pytest-django pytest-cov pytest-xdist requests-mock tblib
          # netbox_routing fork: the plugin has hard FKs to its ISIS/OSPF/BGP/StaticRoute models.
          # Pinned to a commit SHA (not the mutable feature/integration branch) so CI is
          # reproducible and a fork push cannot silently change what this repo tests against.
          # This SHA is feature/integration's tip and provides the netbox_routing.helpers.isis
          # module (NET_RE, auth_pair_errors) that views.py imports, migration
          # 0039_bgprouter_router_id (BGPRouter.router_id, BGPPeer.source/local_as/ttl,
          # IS-IS FRR + SRv6 prefix-SID), and the static-route form/serializer refusals
          # test_static_route_refusals.py exercises.
          uv pip install --system "netbox-routing @ git+https://github.com/marcinpsk/netbox-routing.git@dca9ed1a4a972e9dfeba95dbed10247d46eba405"
          uv pip install --system -e .

      - name: Set up NetBox configuration
        working-directory: netbox
        run: |
          cat > netbox/netbox/configuration.py << 'EOF'
          import os

          ALLOWED_HOSTS = ['*']
          DATABASE = {
              # Honored by the tests that re-enter manage.py in a subprocess: they forward the
              # parent's real test-database name, which a hardcoded name would send to the wrong DB.
              'NAME': os.environ.get('DB_NAME', 'netbox'),
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': 'localhost',
              'PORT': '',
              'CONN_MAX_AGE': 300,
              'ENGINE': 'django.db.backends.postgresql'
          }
          REDIS = {
              'tasks': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 0},
              'caching': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 1}
          }
          SECRET_KEY = 'test-secret-key-not-for-production-1234567890123456'
          API_TOKEN_PEPPERS = {0: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}
          PLUGINS = ['netbox_routing', 'netbox_nso_plugin']
          PLUGINS_CONFIG = {
              'netbox_nso_plugin': {
                  'adapter_url': 'https://adapter.mock.invalid',
                  'adapter_token': 'test-bearer-token',
              }
          }
          EOF

      - name: Run the hermetic test suite with coverage
        working-directory: netbox-nso-plugin
        env:
          NETBOX_CONFIGURATION: netbox.configuration
          NETBOX_NSO_USE_REAL_NETBOX: "1"
          PYTHONPATH: ${{ github.workspace }}/netbox/netbox
          TEST_DB_NAME: test_netbox_nso_plugin_ci
        # Four workers match the standard public runner's CPU allocation. The
        # plugin conftest gives each worker an isolated PostgreSQL database.
        # The pythonpath override replaces the ini value (devcontainer netbox +
        # netbox_stubs): the stubs would shadow the real NetBox checkout here.
        run: pytest -n 4 --disable-warnings -o pythonpath=../netbox/netbox

  live-adapter-contract:
    name: Live adapter contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      adapter-postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_USER: adapter
          POSTGRES_PASSWORD: adapter
          POSTGRES_DB: adapter
        options: >-
          --health-cmd "pg_isready -U adapter -d adapter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 55432:5432

    steps:
      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: netbox-nso-plugin
          persist-credentials: false

      # This compatibility job intentionally follows adapter main. A breaking
      # adapter change should fail plugin CI before the two public repositories
      # silently diverge.
      - name: Check out the live adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: marcinpsk/nso-adapter
          ref: main
          path: nso-adapter
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the adapter image
        working-directory: nso-adapter
        run: docker build --tag nso-adapter-contract:ci .

      - name: Start the adapter with a real PostgreSQL store
        env:
          ADAPTER_DATABASE_URL: postgresql+asyncpg://adapter:adapter@127.0.0.1:55432/adapter
          ADAPTER_TOKEN: contract-adapter-token
          NETBOX_TOKEN: contract-netbox-token
        # The instance entry is a name the store validates onboarding against, nothing more:
        # it points at a closed port and the streams and both scheduler ticks are off, so no
        # request ever leaves for it. Without it the store-side contract checks cannot create
        # the throwaway devices they push intent to.
        run: |
          cat > "${RUNNER_TEMP}/adapter-contract.yaml" <<'EOF'
          secrets:
            provider: local
          nso_instances:
            - name: contract
              base_url: http://127.0.0.1:9
              username_ref: CONTRACT_NSO_USERNAME
              password_ref: CONTRACT_NSO_PASSWORD
          netbox:
            base_url: http://127.0.0.1:9
            api_token_ref: CONTRACT_NETBOX_TOKEN
          api:
            adapter_token_ref: CONTRACT_ADAPTER_TOKEN
          database_url: postgresql+asyncpg://adapter:adapter@127.0.0.1:55432/adapter
          log_level: WARNING
          log_format: json
          scheduler:
            enable_nso_streams: false
            poll_interval: 1440
            scope_reconcile_interval: 1440
          EOF
          docker run --detach --name nso-adapter-contract --network host \
            --env CONFIG_FILE=/app/config.contract.yaml \
            --env DATABASE_URL="$ADAPTER_DATABASE_URL" \
            --env CONTRACT_ADAPTER_TOKEN="$ADAPTER_TOKEN" \
            --env CONTRACT_NETBOX_TOKEN="$NETBOX_TOKEN" \
            --env CONTRACT_NSO_USERNAME=contract \
            --env CONTRACT_NSO_PASSWORD=contract \
            --volume "${RUNNER_TEMP}/adapter-contract.yaml:/app/config.contract.yaml:ro" \
            nso-adapter-contract:ci \
            uvicorn nso_adapter.main:app --host 127.0.0.1 --port 18000

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs nso-adapter-contract
            exit 1
          fi

      - name: Install plugin contract-test dependencies
        working-directory: netbox-nso-plugin
        run: uv sync --group dev

      - name: Exercise the real plugin-to-adapter HTTP contract
        working-directory: netbox-nso-plugin
        env:
          NSO_LIVE_ADAPTER_TEST: "1"
          NSO_LIVE_ADAPTER_URL: http://127.0.0.1:18000
          NSO_LIVE_ADAPTER_TOKEN: contract-adapter-token
        run: >-
          uv run --native-tls -- pytest
          -c /dev/null --rootdir=.
          contract_tests/test_live_adapter_contract.py
          --quiet

      - name: Show adapter logs on failure
        if: failure()
        run: docker logs nso-adapter-contract
