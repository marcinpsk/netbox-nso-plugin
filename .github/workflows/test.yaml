name: Test with supported NetBox and Python versions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-netbox:
    # Temporarily disabled by operator request. Keep the job/check name in place
    # so branch-protection configuration does not need to change.
    if: ${{ false }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.12", "3.13"]
        netbox-version: ["v4.6.1"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          path: netbox-nso-plugin

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout NetBox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          repository: netbox-community/netbox
          path: netbox
          ref: ${{ matrix.netbox-version }}

      - name: Install NetBox and plugin
        working-directory: netbox-nso-plugin
        run: |
          uv pip install --system -r ../netbox/requirements.txt
          uv pip install --system pytest pytest-django tblib coverage
          # netbox_routing fork: the plugin has hard FKs to its ISIS/OSPF/BGP/StaticRoute models.
          # Pinned to a commit SHA (not the mutable feature/integration branch) so CI is
          # reproducible and a fork push cannot silently change what this repo tests against.
          # This SHA is feature/integration's tip and provides the netbox_routing.helpers.isis
          # module (NET_RE, auth_pair_errors) that views.py imports, plus migration
          # 0039_bgprouter_router_id (BGPRouter.router_id, BGPPeer.source/local_as/ttl,
          # IS-IS FRR + SRv6 prefix-SID).
          uv pip install --system "netbox-routing @ git+https://github.com/marcinpsk/netbox-routing.git@fef7d918b7949ecfa97cb6b550e65f98e578113a"
          uv pip install --system -e .

      - name: Set up NetBox configuration
        working-directory: netbox
        run: |
          cat > netbox/netbox/configuration.py << 'EOF'
          ALLOWED_HOSTS = ['*']
          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': 'localhost',
              'PORT': '',
              'CONN_MAX_AGE': 300,
              'ENGINE': 'django.db.backends.postgresql'
          }
          REDIS = {
              'tasks': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 0},
              'caching': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 1}
          }
          SECRET_KEY = 'test-secret-key-not-for-production-1234567890123456'
          API_TOKEN_PEPPERS = {0: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}
          PLUGINS = ['netbox_routing', 'netbox_nso_plugin']
          PLUGINS_CONFIG = {
              'netbox_nso_plugin': {
                  'adapter_url': 'https://adapter.mock.invalid',
                  'adapter_token': 'test-bearer-token',
              }
          }
          EOF

      - name: Run tests with coverage
        working-directory: netbox/netbox
        env:
          NETBOX_CONFIGURATION: netbox.configuration
          COVERAGE_RCFILE: ../../netbox-nso-plugin/pyproject.toml
        run: |
          # --noinput: never block on the "destroy the old test database?" prompt
          # (a leftover test DB would otherwise hang the job with EOFError).
          coverage run manage.py test netbox_nso_plugin --verbosity=2 --noinput
          coverage report
