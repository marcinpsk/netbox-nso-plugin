name: Lint and Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run Ruff linting
        run: uv run --frozen ruff check .

      - name: Run Ruff formatting check
        run: uv run --frozen ruff format --check .

      - name: Audit the GitHub Actions workflows
        run: uv run --frozen zizmor .github/workflows

      - name: Download OpenGrep
        env:
          OPENGREP_BIN: ${{ runner.temp }}/opengrep
        run: |
          curl --fail --location --show-error --silent \
            --output "$OPENGREP_BIN" \
            https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep_manylinux_x86

      - name: Verify OpenGrep
        env:
          OPENGREP_BIN: ${{ runner.temp }}/opengrep
          OPENGREP_SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
        run: |
          printf '%s  %s\n' "$OPENGREP_SHA256" "$OPENGREP_BIN" | sha256sum -c -
          chmod +x "$OPENGREP_BIN"

      - name: Scan review patterns
        env:
          OPENGREP_BIN: ${{ runner.temp }}/opengrep
        run: uv run --frozen scripts/check-review-patterns scan

      - name: Test review patterns
        env:
          OPENGREP_BIN: ${{ runner.temp }}/opengrep
        run: uv run --frozen scripts/check-review-patterns test
