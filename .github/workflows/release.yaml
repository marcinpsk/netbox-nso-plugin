name: Release

"on":
  push:
    branches:
      - main

# Never cancel a run that may already be uploading to PyPI.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # semantic-release needs to push its version commit and tag, then create the GitHub release.
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out main with full history
        # zizmor: ignore[artipacked] semantic-release pushes the release commit and tag,
        # so this checkout has to keep its credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || github.token }}

      # The branch may advance while a queued release waits: concurrency serializes the
      # runs, it does not stop the pushes. A run whose commit is no longer the tip has
      # nothing left to release (the later push runs its own release from the newer tip),
      # and resetting back to it would only build a version commit that cannot fast-forward.
      - name: Skip a stale release trigger
        id: trigger
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/heads/${RELEASE_REF}"
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" != "$RELEASE_SHA" ]; then
            echo "::notice::${RELEASE_REF} is at ${tip}, not ${RELEASE_SHA}: this run releases nothing"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tip IS this run's commit, so this can only move the checkout forward to it.
          git reset --hard "$RELEASE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # semantic-release's build_command is `uv lock`, so uv has to be on PATH here.
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"

      # release-please never created a tag in this repository. Establish the
      # version declared immediately before this push as the baseline; otherwise
      # semantic-release starts at 0.0.0 and would downgrade the existing 0.1.0.
      - name: Establish the existing version baseline
        id: baseline
        if: steps.trigger.outputs.stale != 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if git tag --list 'v[0-9]*' | grep -q .; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::cannot establish a release baseline without the previous main commit"
            exit 1
          fi
          version="$(git show "${BEFORE_SHA}:pyproject.toml" |
            python -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')"
          git tag "v${version}" "$BEFORE_SHA"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      # Generate the release commit and tags locally. The ref transaction below owns
      # every release ref so GitHub can enforce the triggering tip as a lease.
      # build: true runs build_command, which here is `uv lock`, so the release commit carries
      # a lock matching the version it just wrote. build: false would pass --skip-build and drop
      # that refresh. The wheel and sdist are built from the tag by the `build` job, not here.
      - name: Release from conventional commits
        id: release
        if: steps.trigger.outputs.stale != 'true'
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e  # v10.6.1
        with:
          github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || github.token }}
          build: true
          changelog: true
          push: false
          vcs_release: false

      - name: Validate the release commit versions
        id: validate_release_commit_versions
        if: steps.trigger.outputs.stale != 'true' && steps.release.outputs.released == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git show HEAD:pyproject.toml > "${RUNNER_TEMP}/release-pyproject.toml"
          git show HEAD:netbox_nso_plugin/__init__.py > "${RUNNER_TEMP}/release-init.py"
          git show HEAD:uv.lock > "${RUNNER_TEMP}/release-uv.lock"
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          expected = os.environ["RELEASE_VERSION"]
          if not expected:
              sys.exit("::error::semantic-release returned no version")

          project = tomllib.loads((root / "release-pyproject.toml").read_text(encoding="utf-8"))
          init_source = (root / "release-init.py").read_text(encoding="utf-8")
          init_versions = re.findall(r'^__version__\s*=\s*["\']([^"\']+)["\']\s*$', init_source, re.MULTILINE)
          if len(init_versions) != 1:
              sys.exit(f"::error::expected one __version__ line in HEAD, got {len(init_versions)}")

          lock = tomllib.loads((root / "release-uv.lock").read_text(encoding="utf-8"))
          lock_entries = [pkg for pkg in lock["package"] if pkg["name"] == "netbox-nso-plugin"]
          if len(lock_entries) != 1:
              sys.exit(f"::error::expected one netbox-nso-plugin entry in HEAD:uv.lock, got {len(lock_entries)}")

          found = {
              "HEAD:pyproject.toml": project["project"]["version"],
              "HEAD:netbox_nso_plugin/__init__.py": init_versions[0],
              "HEAD:uv.lock": lock_entries[0]["version"],
          }
          for source, version in found.items():
              if version != expected:
                  sys.exit(f"::error::{source} declares {version}, but semantic-release returned {expected}")
              print(f"{source}: {version}")
          PY

      # Revalidate immediately before the first remote mutation. The atomic push
      # makes the branch, baseline tag, and release tag share one expected-tip lease.
      - name: Publish release refs with expected-tip lease
        if: steps.trigger.outputs.stale != 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          RELEASED: ${{ steps.release.outputs.released || 'false' }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/heads/${RELEASE_REF}"
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" != "$RELEASE_SHA" ]; then
            echo "::error::${RELEASE_REF} advanced to ${tip} before release refs could be published"
            exit 1
          fi

          refs=()
          if [ "$RELEASED" = "true" ]; then
            refs+=("HEAD:refs/heads/${RELEASE_REF}" "$RELEASE_TAG")
          else
            refs+=("${RELEASE_SHA}:refs/heads/${RELEASE_REF}")
          fi
          if [ -n "$BASELINE_TAG" ]; then
            refs+=("$BASELINE_TAG")
          fi
          git push --atomic \
            --force-with-lease="refs/heads/${RELEASE_REF}:${RELEASE_SHA}" \
            origin "${refs[@]}"

      # semantic-release cannot create the GitHub release while its push is disabled.
      # The verified tag is immutable and points at the leased release commit.
      - name: Create the GitHub release
        if: steps.trigger.outputs.stale != 'true' && steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"

  build:
    name: Build sdist and wheel
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0

      - name: Build the distributions
        run: uv build

      # Guards the whole version chain: semantic-release has to have bumped pyproject.toml,
      # netbox_nso_plugin/__init__.py (which is what PluginConfig.version reports to NetBox)
      # and uv.lock (refreshed by build_command) to exactly the tag it cut. The lock is not
      # inside the wheel, but this job checks out the tag, so it is on disk here.
      # Versions are compared as PEP 440 objects, not strings, because a tag
      # like v1.2.3-rc.1 legitimately normalises to 1.2.3rc1 in a filename.
      - name: Verify the built version matches the release tag
        env:
          TAG_NAME: ${{ needs.release.outputs.tag }}
        run: |
          cat > "${RUNNER_TEMP}/verify_version.py" <<'PY'
          import os, sys, tomllib, zipfile
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG_NAME"]
          expected = Version(tag.removeprefix("v"))
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"::error::expected one wheel and one sdist, got {[p.name for p in wheels + sdists]}")

          found = {
              wheels[0].name: parse_wheel_filename(wheels[0].name)[1],
              sdists[0].name: parse_sdist_filename(sdists[0].name)[1],
          }
          with zipfile.ZipFile(wheels[0]) as whl:
              source = whl.read("netbox_nso_plugin/__init__.py").decode()
          declared = [ln for ln in source.splitlines() if ln.startswith("__version__")]
          if len(declared) != 1:
              sys.exit(f"::error::expected one __version__ line in the packaged __init__.py, got {len(declared)}")
          found["__version__"] = Version(declared[0].split("=", 1)[1].strip().strip("\"'"))

          locked = tomllib.loads(Path("uv.lock").read_text())
          entries = [pkg for pkg in locked["package"] if pkg["name"] == "netbox-nso-plugin"]
          if len(entries) != 1:
              sys.exit(f"::error::expected one netbox-nso-plugin entry in uv.lock, got {len(entries)}")
          found["uv.lock"] = Version(entries[0]["version"])

          for where, version in found.items():
              if version != expected:
                  sys.exit(f"::error::{where} declares {version}, but tag {tag} expects {expected}")
              print(f"{where}: {version}")
          PY
          # Pinned: the guard reads uv.lock with tomllib, which needs 3.11+.
          uv run --no-project --python 3.12 --with packaging -- python "${RUNNER_TEMP}/verify_version.py"

      # Hidden files are excluded by default, which keeps uv's dist/.gitignore
      # out of the artifact and therefore out of what is uploaded to PyPI.
      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/netbox-nso-plugin
    # Trusted Publishing: PyPI verifies this short-lived OIDC token against the
    # publisher registered for repo + workflow file + environment. No API token.
    # id-token: write is the only permission needed to request that OIDC token.
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
