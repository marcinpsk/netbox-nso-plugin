name: Release

"on":
  push:
    branches:
      - main

# Never cancel a run that may already be uploading to PyPI.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Every push to main refreshes the pending release PR from the conventional
      # commits since the last tag; merging that PR is what tags and releases.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build sdist and wheel
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Build the distributions
        run: uv build

      # Guards the whole version chain: release-please has to have bumped both
      # pyproject.toml and netbox_nso_plugin/__init__.py (which is what
      # PluginConfig.version reports to NetBox) to exactly the tag it cut.
      # Versions are compared as PEP 440 objects, not strings, because a tag
      # like v1.2.3-rc.1 legitimately normalises to 1.2.3rc1 in a filename.
      - name: Verify the built version matches the release tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cat > "${RUNNER_TEMP}/verify_version.py" <<'PY'
          import os, sys, zipfile
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG_NAME"]
          expected = Version(tag.removeprefix("v"))
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"::error::expected one wheel and one sdist, got {[p.name for p in wheels + sdists]}")

          found = {
              wheels[0].name: parse_wheel_filename(wheels[0].name)[1],
              sdists[0].name: parse_sdist_filename(sdists[0].name)[1],
          }
          with zipfile.ZipFile(wheels[0]) as whl:
              source = whl.read("netbox_nso_plugin/__init__.py").decode()
          declared = [ln for ln in source.splitlines() if ln.startswith("__version__")]
          if len(declared) != 1:
              sys.exit(f"::error::expected one __version__ line in the packaged __init__.py, got {len(declared)}")
          found["__version__"] = Version(declared[0].split("=", 1)[1].strip().strip("\"'"))

          for where, version in found.items():
              if version != expected:
                  sys.exit(f"::error::{where} declares {version}, but tag {tag} expects {expected}")
              print(f"{where}: {version}")
          PY
          uv run --no-project --with packaging -- python "${RUNNER_TEMP}/verify_version.py"

      # Hidden files are excluded by default, which keeps uv's dist/.gitignore
      # out of the artifact and therefore out of what is uploaded to PyPI.
      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/netbox-nso-plugin
    # Trusted Publishing: PyPI verifies this short-lived OIDC token against the
    # publisher registered for repo + workflow file + environment. No API token.
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
